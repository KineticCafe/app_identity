name: Integration CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  integration-ci:
    name: Integration Testing

    permissions:
      contents: read

    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-22.04
        node:
          - 20
        ruby:
          - '3.4'
        elixir:
          - '1.18'
        otp:
          - '27'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: block
          allowed-endpoints: >
            builds.hex.pm:443
            github.com:443
            index.rubygems.org:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            repo.hex.pm:443
            rubygems.org:443

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      # Typescript Setup
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          package_json_file: ts/package.json

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: ./ts

      - run: pnpm build
        working-directory: ./ts

      # Ruby Setup
      - uses: ruby/setup-ruby@4c24fa5ec04b2e79eb40571b1cee2a0d2b705771 # v1.278.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: ./ruby

      # Elixir Setup
      - uses: erlef/setup-beam@e6d7c94229049569db56a7ad5a540c051a010af9 # v1.20.4
        id: install
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - run: mix 'do' deps.get, deps.compile, compile
        working-directory: ./elixir

      - run: mkdir -p suite

      # Generate
      - name: Generate Typescript Integration Suite
        run: pnpm cli:generate ../suite
        working-directory: ./ts

      - name: Generate Ruby Integration Suite
        run: bundle exec ruby -S bin/app-identity-suite-ruby generate ../suite
        working-directory: ./ruby

      - name: Generate Elixir Integration Suite
        run: mix app_identity generate ../suite
        working-directory: ./elixir

      # Run
      - name: Run Typescript Verification
        run: pnpm cli:run ../suite | ../integration/tapview
        working-directory: ./ts

      - name: Run Ruby Verification
        run: bundle exec ruby -S bin/app-identity-suite-ruby run ../suite | ../integration/tapview
        working-directory: ./ruby

      - name: Run Elixir Integration Suite
        run: mix app_identity run ../suite | ../integration/tapview
        working-directory: ./elixir
